<!doctype html>
<html lang="zh">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><title>Python Studio</title
  ><link rel="stylesheet" href="style.css" />
  <body>
    <header>
      <button id="sidebar" aria-label="文件侧栏">☰</button
      ><strong>Python <span>Studio</span></strong
      ><small>AP G1 · WORKSPACE</small>
      <nav>
        <button id="run">▶ Run</button><button id="stop">■ Stop</button
        ><button id="restart">Restart</button><button id="save">Save</button
        ><button id="export">Export</button
        ><button id="settings">Settings</button>
      </nav>
    </header>
    <main>
      <aside>
        <h3>EXPLORER</h3>
        <div class="actions">
          <button id="new">+ File</button><button id="folder">+ Folder</button
          ><button id="import">Import</button>
        </div>
        <div id="files"></div>
        <button id="trash">Recycle bin</button
        ><button id="restorezip">Restore ZIP</button>
        <p class="hint">
          Python 3 · Your work stays on this device.<br />Export a ZIP backup
          regularly.
        </p>
      </aside>
      <section id="work">
        <div id="tabs"></div>
        <div id="editor"></div>
        <div id="symbols"></div>
        <div
          id="split"
          role="separator"
          aria-label="调整控制台高度"
          tabindex="0"
        ></div>
        <section id="console">
          <div class="consolehead">
            <b>TERMINAL</b><span id="runtime"></span
            ><button id="clear">Clear console</button>
          </div>
          <pre id="output" aria-live="polite"></pre>
          <form id="inputform" hidden>
            <label>Input <input id="stdin" autocomplete="off" /></label
            ><button>Send ↵</button>
          </form>
          <div id="analysis"></div>
        </section>
      </section>
    </main>
    <footer>
      <span id="position">Ln 1, Col 1</span><span>Python 3 / UTF-8</span
      ><span id="saved">Opening storage…</span><span id="status">Loading</span>
    </footer>
    <dialog id="dialog">
      <div id="dialogbody"></div>
      <button id="close">Close</button>
    </dialog>
    <input type="file" id="picker" hidden multiple />
    <script src="app.js"></script>
  </body>
</html>
